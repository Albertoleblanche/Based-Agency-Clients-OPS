<!-- The iPhone app. Same backend and the same data code as the desktop (js/core, week-health,
     drafting, sheets-canvas); only the screens are its own (js/mobile/app.js). -->
<script>
  // A password-reset (or invite) link lands with #…type=recovery, or #error_code=… once it has expired.
  // Supabase reads the address and clears it as it starts, so note it first (index.html does the same).
  try{ const h = location.hash || '';
    if(/(^|[#&])type=(recovery|invite)(&|$)/.test(h)) sessionStorage.setItem('bda_recovery', '1');
    if(/(^|[#&])error_(code|description)=/.test(h)) sessionStorage.setItem('bda_link_error', '1'); }catch(e){}
</script>
<script src="vendor/supabase-2.119.0.js"></script>
</head>
<body class="mac mobile" data-theme="light">
<script>
  // Set the theme before anything paints, so a dark-mode phone never flashes white.
  try{ const t = localStorage.getItem('bda_theme'); if(t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.body.dataset.theme = 'dark'; }catch(e){}
</script>
<div id="mApp" class="phone app"><div class="stage"><div class="iscroll"></div></div></div>
<div class="itoast" id="mToast" role="status" aria-live="polite"></div>
