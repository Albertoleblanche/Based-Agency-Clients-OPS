async function mSaveNote(noteId){
  const title = document.getElementById('mNoteTitle').value.trim();
  const clientId = document.getElementById('mNoteClient').value || null;
  const status = document.getElementById('mNoteStatus').value;
  const text = document.getElementById('mNoteText').value.trim();
  const link = document.getElementById('mNoteLink').value.trim() || null;
  if(!text){ mShowToast('error','Write something first'); return; }
  if(noteId){
    const { error } = await supabaseClient.from('notes').update({ title, client_id: clientId, status, text, link }).eq('id', noteId).eq('user_id', currentUser.id);
    if(error){ mShowToast('error','Could not save'); return; }
    const n = notes.find(x=>x.id===noteId);
    if(n){ n.title=title; n.clientId=clientId; n.status=status; n.text=text; n.link=link; }
  } else {
    const { data, error } = await supabaseClient.from('notes').insert({ user_id: currentUser.id, title, client_id: clientId, status, text, link }).select().single();
    if(error){ mShowToast('error','Could not save'); return; }
    notes.unshift({ id:data.id, clientId, title, status, text, link, createdAt:data.created_at, updatedAt:data.updated_at });
  }
  mCloseSheet();
  mShowToast('success','Note saved');
  mRenderNotesList();
}

async function mDeleteNote(noteId){
  const { error } = await supabaseClient.from('notes').update({ deleted_at: new Date().toISOString() }).eq('id', noteId).eq('user_id', currentUser.id);
  if(error){ mShowToast('error','Could not delete'); return; }
  notes = notes.filter(x=>x.id!==noteId);
  mCloseSheet();
  mShowToast('success','Note deleted');
  mRenderNotesList();
}

/* ================================================================
   CALENDAR — full toolbar (date nav, Today, jump-to-date, Month/
   Agenda toggle), 6 type filter tabs as horizontal-scroll pills
   with live counts, a real month grid, and the agenda list as the
   "Agenda" view — matching desktop's actual feature set rather
   than a stripped-down mobile approximation of it.
   ================================================================ */
let calendarEvents = [];
let calendarLoaded = false;
let mCalendarAnchorDate = new Date();
let mCalendarTypeTab = 'all';
let mCalendarViewMode = 'month';

const M_CALENDAR_TYPE_TABS = [
  { key:'all', label:'All' },
  { key:'meeting', label:'Meetings' },
  { key:'deadline', label:'Deadlines' },
  { key:'reminder', label:'Reminders' },
  { key:'other', label:'Other' },
  { key:'conflicted', label:'Conflicted' },
];

async function mLoadCalendarEvents(){
  const from = new Date(); from.setDate(from.getDate()-1);
  const to = new Date(); to.setDate(to.getDate()+60);
  const { data, error } = await supabaseClient.from('calendar_events').select('*')
    .gte('start_at', from.toISOString()).lte('start_at', to.toISOString()).order('start_at',{ascending:true});
  if(error){ mShowToast('error','Could not load calendar'); return; }
  calendarEvents = (data||[]).map(e=>({
    id:e.id, title:e.title, description:e.description||'', startAt:e.start_at, endAt:e.end_at,
    allDay:e.all_day, clientId:e.client_id, eventType:e.event_type, location:e.location||'',
    createdBy:e.created_by, attendeeIds:e.attendee_ids||[]
  }));
  calendarLoaded = true;
}

// Exact match to desktop's findEventConflicts() — a real time-overlap
// check against shared attendees, not a placeholder "conflicted" label.
function mFindEventConflicts(startAtStr, endAtStr, attendeeIds, excludeEventId){
  if(!attendeeIds.length) return [];
  const newStart = new Date(startAtStr), newEnd = new Date(endAtStr);
  return calendarEvents.filter(e=>{
    if(e.id===excludeEventId || e.allDay) return false;
    const eStart = new Date(e.startAt), eEnd = new Date(e.endAt);
    if(!(newStart < eEnd && newEnd > eStart)) return false;
    const eAttendees = e.attendeeIds && e.attendeeIds.length ? e.attendeeIds : [e.createdBy];
    return eAttendees.some(id=>attendeeIds.includes(id));
  });
}

// "Conflicted" isn't a real event_type — it's computed per event, so it
// needs its own branch rather than a simple field match, same as desktop.
function mEventMatchesTypeTab(e, tab){
  if(tab==='all') return true;
  if(tab==='conflicted'){
    if(e.allDay) return false;
    const effectiveAttendees = e.attendeeIds && e.attendeeIds.length ? e.attendeeIds : [e.createdBy];
    return mFindEventConflicts(e.startAt, e.endAt, effectiveAttendees, e.id).length > 0;
  }
  return e.eventType===tab;
}

function mGetCalendarPeriodRange(){
  if(mCalendarViewMode==='agenda'){
    const start = new Date(); start.setHours(0,0,0,0);
    const end = new Date(start); end.setDate(end.getDate()+60);
    return { start, end };
  }
  const year = mCalendarAnchorDate.getFullYear(), month = mCalendarAnchorDate.getMonth();
  return { start: new Date(year, month, 1), end: new Date(year, month+1, 1) };
}

function mShiftCalendarPeriod(dir){
  mCalendarAnchorDate.setMonth(mCalendarAnchorDate.getMonth()+dir);
  mRenderCalendarMain();
}
function mResetCalendarToToday(){
  mCalendarAnchorDate = new Date();
  mRenderCalendarMain();
}
function mJumpToCalendarDate(dateStr){
  if(!dateStr) return;
  mCalendarAnchorDate = new Date(dateStr+'T00:00:00');
  mRenderCalendarMain();
}
function mSwitchCalendarViewMode(mode){
  mCalendarViewMode = mode;
  mRenderCalendarMain();
}
function mSwitchCalendarTypeTab(tab){
  mCalendarTypeTab = tab;
  mRenderCalendarMain();
}

async function mOpenCalendarAgenda(){
  if(!calendarLoaded) await mLoadCalendarEvents();
  mRenderCalendarMain();
}

function mRenderCalendarMain(){
  const todayStr = toDateStr(new Date());
  const todayEvents = calendarEvents.filter(e=>toDateStr(new Date(e.startAt))===todayStr);
  const todaySummary = !todayEvents.length
    ? `${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})} — nothing on the calendar today.`
    : (()=>{
        const meetings = todayEvents.filter(e=>e.eventType==='meeting').length;
        const others = todayEvents.length - meetings;
        const parts = [];
        if(meetings) parts.push(`${meetings} meeting${meetings!==1?'s':''}`);
        if(others) parts.push(`${others} other event${others!==1?'s':''}`);
        return `${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})} — you have ${parts.join(' and ')} today.`;
      })();

  const { start, end } = mGetCalendarPeriodRange();
  const periodEvents = calendarEvents.filter(e=>{ const s = new Date(e.startAt); return s >= start && s < end; });
  const monthLabel = mCalendarAnchorDate.toLocaleDateString('en-US',{month:'long',year:'numeric'});

  const html = `
    <div class="m-cal-toolbar">
      <div class="m-cal-today-summary">${todaySummary}</div>
      <div class="m-cal-nav-row">
        <div class="m-date-nav">
          <button class="m-date-nav-arrow" onclick="mShiftCalendarPeriod(-1)" ${mCalendarViewMode==='agenda'?'disabled style="opacity:.35;"':''}>‹</button>
          <span class="m-date-nav-label">${mCalendarViewMode==='agenda'?'Next 60 days':monthLabel}</span>
          <button class="m-date-nav-arrow" onclick="mShiftCalendarPeriod(1)" ${mCalendarViewMode==='agenda'?'disabled style="opacity:.35;"':''}>›</button>
        </div>
        <button class="m-cal-today-btn" onclick="mResetCalendarToToday()">Today</button>
      </div>
      <div class="m-cal-nav-row">
        <div class="m-view-toggle">
          <div class="m-view-toggle-option ${mCalendarViewMode==='month'?'active':''}" onclick="mSwitchCalendarViewMode('month')">Month</div>
          <div class="m-view-toggle-option ${mCalendarViewMode==='agenda'?'active':''}" onclick="mSwitchCalendarViewMode('agenda')">Agenda</div>
        </div>
        <input type="date" onchange="mJumpToCalendarDate(this.value)" style="flex:1;min-width:0;font-size:12px;padding:8px 10px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--ink);">
      </div>
    </div>

    <div class="m-chip-row">
      ${M_CALENDAR_TYPE_TABS.map(t=>{
        const count = t.key==='all' ? periodEvents.length : periodEvents.filter(e=>mEventMatchesTypeTab(e,t.key)).length;
        return `<div class="m-chip ${mCalendarTypeTab===t.key?'active':''}" onclick="mSwitchCalendarTypeTab('${t.key}')">${t.label} <span style="opacity:.6;">${count}</span></div>`;
      }).join('')}
    </div>

    <div id="mCalendarBody"></div>
  `;

  const action = `<button class="m-icon-btn" onclick="mOpenNewEventSheet()" aria-label="New event">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>`;
  mOpenSubscreen('Calendar', html, action);

  const body = document.getElementById('mCalendarBody');
  if(mCalendarViewMode==='month') body.innerHTML = mCalendarMonthGridHtml();
  else body.innerHTML = mCalendarAgendaHtml();
}

// Exact match to desktop's renderCalendarMonthView() structure — a
// Monday-aligned 42-cell grid. Full text event pills don't fit a
// touch-sized mobile cell, so each day shows small colored dots (one per
// event, capped) instead — tapping the day opens its full event list.
function mCalendarMonthGridHtml(){
  const year = mCalendarAnchorDate.getFullYear(), month = mCalendarAnchorDate.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const gridStart = getWeekStart(firstOfMonth);
  const todayStr = toDateStr(new Date());

  const eventsByDay = {};
  calendarEvents.filter(e=>mEventMatchesTypeTab(e, mCalendarTypeTab)).forEach(e=>{
    const d = toDateStr(new Date(e.startAt));
    if(!eventsByDay[d]) eventsByDay[d] = [];
    eventsByDay[d].push(e);
  });

  let daysHtml = '';
  for(let i=0;i<42;i++){
    const cellDate = new Date(gridStart);
    cellDate.setDate(cellDate.getDate()+i);
    const cellStr = toDateStr(cellDate);
    const isOtherMonth = cellDate.getMonth()!==month;
    const isToday = cellStr===todayStr;
    const dayEvents = (eventsByDay[cellStr]||[]).sort((a,b)=> new Date(a.startAt)-new Date(b.startAt));
    const shown = dayEvents.slice(0,4);
    const extra = dayEvents.length - shown.length;

    daysHtml += `<div class="m-calendar-day ${isOtherMonth?'other-month':''} ${isToday?'today':''}" onclick="mOpenDayEventsSheet('${cellStr}')">
      <div class="m-calendar-day-num">${cellDate.getDate()}</div>
      <div class="m-calendar-dot-row">
        ${shown.map(e=>{
          const meta = {meeting:'var(--blue)', deadline:'var(--red)', reminder:'var(--amber)', other:'var(--muted-lt)'}[e.eventType] || 'var(--muted-lt)';
          return `<span class="m-calendar-event-dot" style="background:${meta};"></span>`;
        }).join('')}
      </div>
      ${extra>0 ? `<div class="m-calendar-more-label">+${extra}</div>` : ''}
    </div>`;
  }

  return `<div class="m-calendar-grid-head"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div>
    <div class="m-calendar-grid">${daysHtml}</div>`;
}

function mOpenDayEventsSheet(dateStr){
  const dayEvents = calendarEvents
    .filter(e=>mEventMatchesTypeTab(e, mCalendarTypeTab) && toDateStr(new Date(e.startAt))===dateStr)
    .sort((a,b)=> new Date(a.startAt)-new Date(b.startAt));
  const label = new Date(dateStr+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const html = dayEvents.length
    ? dayEvents.map(e=>mAgendaEventRow(e)).join('')
    : `<div class="m-empty">Nothing scheduled.</div>`;
  const actions = `<button class="m-btn m-btn-brand m-btn-full" onclick="mOpenNewEventSheet('${dateStr}')">+ New event this day</button>`;
  mOpenSheet(label, html, actions);
}

function mCalendarAgendaHtml(){
  const todayStr = toDateStr(new Date());
  const upcoming = calendarEvents.filter(e=>toDateStr(e.startAt) >= todayStr && mEventMatchesTypeTab(e, mCalendarTypeTab));
  const groups = new Map();
  upcoming.forEach(e=>{
    const day = toDateStr(e.startAt);
    if(!groups.has(day)) groups.set(day, []);
    groups.get(day).push(e);
  });
  return groups.size ? [...groups.entries()].map(([day, events])=>`
    <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:18px 0 8px;">${mAgendaDayLabel(day)}</div>
    <div class="m-card" style="padding:0 16px;">
      ${events.map(e=>mAgendaEventRow(e)).join('')}
    </div>
  `).join('') : `<div class="m-empty">Nothing on the calendar in the next 60 days.</div>`;
}

function mAgendaDayLabel(dayStr){
  const todayStr = toDateStr(new Date());
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
  if(dayStr===todayStr) return 'Today';
  if(dayStr===toDateStr(tomorrow)) return 'Tomorrow';
  return new Date(dayStr+'T00:00:00').toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
}

function mAgendaEventRow(e){
  const c = clients.find(x=>x.id===e.clientId);
  const time = e.allDay ? 'All day' : new Date(e.startAt).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  const typeColor = {meeting:'var(--blue)', deadline:'var(--red)', reminder:'var(--amber)', other:'var(--muted-lt)'}[e.eventType] || 'var(--muted-lt)';
  return `<div class="m-list-row" onclick="mOpenEventDetail('${e.id}')">
    <div class="m-list-meta" style="text-align:left;width:64px;flex:none;">${time}</div>
    <span style="width:7px;height:7px;border-radius:50%;background:${typeColor};flex:none;"></span>
    <div class="m-list-main">
      <div class="m-list-title">${escapeHtml(e.title)}</div>
      ${c || e.location ? `<div class="m-list-sub">${c?escapeHtml(c.name):''}${c&&e.location?' · ':''}${escapeHtml(e.location)}</div>` : ''}
    </div>
  </div>`;
}

function mOpenEventDetail(eventId){
  const e = calendarEvents.find(x=>x.id===eventId);
  if(!e) return;
  const c = clients.find(x=>x.id===e.clientId);
  const html = `
    <div style="font-size:16px;font-weight:700;margin-bottom:10px;">${escapeHtml(e.title)}</div>
    <div style="display:flex;flex-direction:column;gap:8px;font-size:13px;">
      <div style="display:flex;justify-content:space-between;"><span style="color:var(--muted);">When</span><span style="font-weight:600;">${e.allDay ? new Date(e.startAt).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : new Date(e.startAt).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</span></div>
      ${c ? `<div style="display:flex;justify-content:space-between;"><span style="color:var(--muted);">Client</span><span style="font-weight:600;">${escapeHtml(c.name)}</span></div>` : ''}
      ${e.location ? `<div style="display:flex;justify-content:space-between;"><span style="color:var(--muted);">Location</span><span style="font-weight:600;">${escapeHtml(e.location)}</span></div>` : ''}
    </div>
    ${e.description ? `<div style="margin-top:14px;font-size:13px;color:var(--muted);line-height:1.5;">${escapeHtml(e.description)}</div>` : ''}
  `;
  mOpenSheet('Event', html);
}

function mOpenNewEventSheet(presetDateStr){
  const html = `
    <div class="m-field"><label>Title</label><input id="mEventTitle" placeholder="e.g. Client check-in call"></div>
    <div class="m-field"><label>Type</label>
      <select id="mEventType"><option value="meeting">Meeting</option><option value="deadline">Deadline</option><option value="reminder">Reminder</option><option value="other">Other</option></select>
    </div>
    <div class="m-field"><label>Date</label><input type="date" id="mEventDate" value="${presetDateStr || toDateStr(new Date())}"></div>
    <div class="m-field"><label>Time (leave blank for all-day)</label><input type="time" id="mEventTime"></div>
    <div class="m-field" style="margin-bottom:0;"><label>Client (optional)</label>
      <select id="mEventClient"><option value="">— None —</option>${clients.filter(c=>!c.deletedAt).sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}</select>
    </div>
  `;
  const actions = `<button class="m-btn m-btn-outline" onclick="mCloseSheet()">Cancel</button><button class="m-btn m-btn-brand" onclick="mSaveNewEvent()">Save</button>`;
  mOpenSheet('New event', html, actions);
}

async function mSaveNewEvent(){
  const title = document.getElementById('mEventTitle').value.trim();
  if(!title){ mShowToast('error','Give the event a title'); return; }
  const eventType = document.getElementById('mEventType').value;
  const date = document.getElementById('mEventDate').value;
  const time = document.getElementById('mEventTime').value;
  const clientId = document.getElementById('mEventClient').value || null;
  const allDay = !time;
  const startAt = allDay ? `${date}T00:00:00` : `${date}T${time}:00`;
  const endAt = allDay ? `${date}T23:59:59` : `${date}T${time}:00`;
  const { data, error } = await supabaseClient.from('calendar_events').insert({
    title, start_at: startAt, end_at: endAt, all_day: allDay, client_id: clientId,
    created_by: currentUser.id, event_type: eventType
  }).select().single();
  if(error){ mShowToast('error','Could not save event'); return; }
  calendarEvents.push({
    id:data.id, title, description:'', startAt, endAt, allDay, clientId, eventType, location:'',
    createdBy: currentUser.id, attendeeIds: []
  });
  calendarEvents.sort((a,b)=> a.startAt.localeCompare(b.startAt));
  mCloseSheet();
  mShowToast('success','Event added');
  mRenderCalendarMain();
}

/* ================================================================
   TIME TRACKER — a persistent timer (survives closing the app,
   same bda_ localStorage pattern desktop already uses) with a
   mini status bar visible across every tab while running, not
   confined to one screen — starting a timer on a client visit
   and then checking Tasks while it runs is the whole point.
   ================================================================ */
let mTimerState = { running:false, startedAt:null, clientId:'', service:'', description:'' };
let mTimerIntervalId = null;
let todaysTimeEntries = [];
let timeEntriesLoaded = false;

function mSaveTimerState(){
  try{ localStorage.setItem('bda_mobile_timer', JSON.stringify(mTimerState)); }catch(e){}
}
function mLoadTimerStateFromStorage(){
  try{
    const raw = localStorage.getItem('bda_mobile_timer');
    if(raw) mTimerState = JSON.parse(raw);
  }catch(e){}
}

function mInitTimerFromStorage(){
  mLoadTimerStateFromStorage();
  if(mTimerState.running && mTimerState.startedAt){
    mUpdateTimerBar();
    mTimerIntervalId = setInterval(mUpdateTimerBar, 1000);
  }
}

function mUpdateTimerBar(){
  const bar = document.getElementById('mTimerBar');
  if(!mTimerState.running){ bar.classList.remove('show'); return; }
  bar.classList.add('show');
  const c = clients.find(x=>x.id===mTimerState.clientId);
  document.getElementById('mTimerBarClient').textContent = c ? c.name : 'Untitled';
  const elapsedMs = Date.now() - mTimerState.startedAt;
  const totalSec = Math.floor(elapsedMs/1000);
  const h = String(Math.floor(totalSec/3600)).padStart(2,'0');
  const m = String(Math.floor((totalSec%3600)/60)).padStart(2,'0');
  const s = String(totalSec%60).padStart(2,'0');
  document.getElementById('mTimerBarElapsed').textContent = `${h}:${m}:${s}`;
}

function mStartTimer(clientId, service, description){
  mTimerState = { running:true, startedAt:Date.now(), clientId, service, description };
  mSaveTimerState();
  mUpdateTimerBar();
  if(mTimerIntervalId) clearInterval(mTimerIntervalId);
  mTimerIntervalId = setInterval(mUpdateTimerBar, 1000);
  mShowToast('success','Timer started');
}

async function mStopTimer(){
  if(mTimerIntervalId){ clearInterval(mTimerIntervalId); mTimerIntervalId = null; }
  const elapsedMs = Date.now() - mTimerState.startedAt;
  const minutes = Math.max(1, Math.round(elapsedMs/60000));
  const { clientId, service, description } = mTimerState;
  mTimerState = { running:false, startedAt:null, clientId:'', service:'', description:'' };
  mSaveTimerState();
  document.getElementById('mTimerBar').classList.remove('show');

  const { error } = await mMergeOrInsertTimeEntry({ clientId, service, dateStr: toDateStr(new Date()), minutes, description });
  if(error){ mShowToast('error','Could not save time entry'); return; }
  mShowToast('success', `Logged ${minutes}m`);
  timeEntriesLoaded = false;
  if(document.getElementById('mSubscreenTitle').textContent==='Time Tracker') mOpenTimeTracker();
}

// Same merge behavior as desktop: accumulates into an existing entry for
// the same user/client/service/day rather than creating a duplicate row,
// re-fetching fresh from the database (not trusting a local cache) since
// another entry could plausibly land in the same window.
async function mMergeOrInsertTimeEntry({ clientId, service, dateStr, minutes, description }){
  const { data: existing } = await supabaseClient.from('time_entries').select('id, minutes, description')
    .eq('user_id', currentUser.id).eq('client_id', clientId).eq('service', service||'')
    .eq('entry_date', dateStr).is('deleted_at', null).maybeSingle();
  if(existing){
    const newTotal = existing.minutes + minutes;
    const newDesc = [existing.description, description].filter(Boolean).join(' · ');
    const { error } = await supabaseClient.from('time_entries').update({ minutes: newTotal, description: newDesc }).eq('id', existing.id);
    return { error };
  }
  const { error } = await supabaseClient.from('time_entries').insert({
    user_id: currentUser.id, client_id: clientId, entry_date: dateStr, minutes, description, service
  });
  return { error };
}

async function mLoadTodaysTimeEntries(){
  const { data, error } = await supabaseClient.from('time_entries').select('*')
    .eq('user_id', currentUser.id).eq('entry_date', toDateStr(new Date())).is('deleted_at', null).order('created_at',{ascending:false});
  if(error){ mShowToast('error','Could not load entries'); return; }
  todaysTimeEntries = (data||[]).map(e=>({ id:e.id, clientId:e.client_id, minutes:e.minutes, description:e.description||'', service:e.service||'' }));
  timeEntriesLoaded = true;
}

async function mOpenTimeTracker(presetClientId){
  await mLoadTodaysTimeEntries();
  mRenderTimeTracker(presetClientId);
}

function mRenderTimeTracker(presetClientId){
  const totalMin = todaysTimeEntries.reduce((s,e)=>s+e.minutes,0);
  const activeClients = clients.filter(c=>!c.deletedAt).sort((a,b)=>a.name.localeCompare(b.name));
  const html = `
    <div class="m-metric-grid" style="grid-template-columns:1fr;">
      <div class="m-card"><div class="m-metric-value">${Math.floor(totalMin/60)}h ${totalMin%60}m</div><div class="m-metric-label">Logged today</div></div>
    </div>
    ${!mTimerState.running ? `
    <div class="m-card">
      <div class="m-card-row"><h3>Start a timer</h3></div>
      <div class="m-field"><label>Client</label><select id="mTimerClient">${activeClients.map(c=>`<option value="${c.id}" ${presetClientId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></div>
      <div class="m-field"><label>Service (optional)</label><input id="mTimerService" placeholder="e.g. SEO, Web Design"></div>
      <div class="m-field" style="margin-bottom:0;"><label>What are you working on?</label><input id="mTimerDesc" placeholder="Short description"></div>
      <button class="m-btn m-btn-brand m-btn-full" style="margin-top:14px;" onclick="mStartTimerFromForm()">Start timer</button>
    </div>` : `<div class="m-empty" style="padding:16px 0;">Timer is running — see the bar above.</div>`}
    <div class="m-card" style="padding:0 16px;">
      <div class="m-card-row" style="padding-top:14px;"><h3>Today's entries</h3></div>
      ${todaysTimeEntries.length ? todaysTimeEntries.map(e=>mTimeEntryRow(e)).join('') : `<div class="m-empty">Nothing logged yet today.</div>`}
    </div>
  `;
  mOpenSubscreen('Time Tracker', html);
}

function mTimeEntryRow(e){
  const c = clients.find(x=>x.id===e.clientId);
  const h = Math.floor(e.minutes/60), m = e.minutes%60;
  return `<div class="m-list-row" style="cursor:default;">
    <div class="m-list-icon" style="background:var(--surface-2);color:var(--ink);border-radius:50%;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
    <div class="m-list-main">
      <div class="m-list-title">${c?escapeHtml(c.name):'—'}${e.service?' · '+escapeHtml(e.service):''}</div>
      ${e.description ? `<div class="m-list-sub">${escapeHtml(e.description)}</div>` : ''}
    </div>
    <div class="m-list-meta">${h?h+'h ':''}${m}m</div>
  </div>`;
}

function mStartTimerFromForm(){
  const clientId = document.getElementById('mTimerClient').value;
  const service = document.getElementById('mTimerService').value.trim();
  const description = document.getElementById('mTimerDesc').value.trim();
  mStartTimer(clientId, service, description);
  mRenderTimeTracker();
}

/* ================================================================
   NOTIFICATIONS — opens as a sheet from the header bell.
   ================================================================ */
function mOpenNotifications(){
  const html = notifications.length ? notifications.map(n=>`
    <div class="m-list-row" onclick="mHandleNotifClick('${n.id}')" style="opacity:${n.read?0.6:1};">
      <div class="m-list-icon" style="background:var(--surface-2);color:var(--ink);border-radius:50%;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </div>
      <div class="m-list-main">
        <div class="m-list-title">${escapeHtml(n.title)}${!n.read?' <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brand);margin-left:4px;vertical-align:middle;"></span>':''}</div>
        <div class="m-list-sub" style="white-space:normal;">${escapeHtml(n.body)}</div>
      </div>
    </div>
  `).join('') : `<div class="m-empty">No notifications.</div>`;
  mOpenSheet('Notifications', html);
}

async function mHandleNotifClick(id){
  const n = notifications.find(x=>x.id===id);
  if(!n) return;
  if(!n.read){
    await supabaseClient.from('notifications').update({ read:true }).eq('id', id);
    n.read = true;
    mUpdateBadges();
  }
  mCloseSheet();
  if(n.targetView==='reminders') mRenderReminders();
  else if(n.targetView==='approve' && n.targetId){ mSwitchTab('queue'); setTimeout(()=>mOpenQueueDetail(n.targetId), 300); }
  else if(n.targetView==='tasks') mSwitchTab('tasks');
}

/* ================================================================
   REALTIME — same subscriptions the desktop app relies on, so a
   change made on desktop shows up here without a manual refresh.
   ================================================================ */
function setupMRealtime(){
  supabaseClient.channel('mobile-tasks').on('postgres_changes', {event:'*', schema:'public', table:'tasks'}, ()=>mLoadAll().then(()=>{ if(activeTab==='tasks') mRenderTasks(); if(activeTab==='home') mRenderHome(); })).subscribe();
  supabaseClient.channel('mobile-reminders').on('postgres_changes', {event:'*', schema:'public', table:'client_reminders'}, ()=>mLoadAll().then(()=>{ if(activeTab==='reminders') mRenderReminders(); if(activeTab==='home') mRenderHome(); })).subscribe();
  supabaseClient.channel('mobile-notifications').on('postgres_changes', {event:'*', schema:'public', table:'notifications', filter:`user_id=eq.${currentUser.id}`}, ()=>mLoadAll()).subscribe();
}

/* ================================================================
   BOOTSTRAP
   ================================================================ */
document.getElementById('mLoginPassword')?.addEventListener('keydown', e=>{ if(e.key==='Enter') mHandleLogin(); });
mBoot();
</script>
